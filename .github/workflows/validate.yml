name: Validate infrastructure

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Validate Docker playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/docker.yml --syntax-check

      - name: Validate Homepage playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/homepage.yml --syntax-check

      - name: Validate Homepage Compose configuration
        run: docker compose -f ansible/templates/homepage/compose.yml config --quiet

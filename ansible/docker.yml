---
- name: Install Docker on Raspberry Pi
  hosts: raspberry
  become: true

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name: 
           - docker.io
           - docker-compose
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
